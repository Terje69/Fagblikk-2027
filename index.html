<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1410">
  <title>Fagblikk Gent · Melle 2027</title>
  <meta name="description" content="Fagblikk 2027. Gent og Melle. Bier, friet, discipline.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23b3261e' stroke='%231b1410' stroke-width='4'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' font-family='Georgia,serif' font-weight='bold' fill='%23f2b705'%3EF%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --paper: #f1e4c3;
      --paper-dark: #e6d3a6;
      --ink: #1b1410;
      --gold: #f2b705;
      --red: #b3261e;
      --green: #2f5d3a;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,.35), transparent 40%),
        radial-gradient(circle at 80% 90%, rgba(179,38,30,.10), transparent 45%),
        var(--paper);
      color: var(--ink);
      font-family: Georgia, 'Times New Roman', serif;
      padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }

    /* Flaggbånd øverst: svart, gult, rødt */
    .tricolor {
      display: flex;
      height: 14px;
      max-width: 620px;
      margin: 0 auto 14px;
      border: 2px solid var(--ink);
    }
    .tricolor span { flex: 1; }
    .tricolor span:nth-child(1) { background: var(--ink); }
    .tricolor span:nth-child(2) { background: var(--gold); }
    .tricolor span:nth-child(3) { background: var(--red); }

    .poster {
      position: relative;
      max-width: 620px;
      margin: 0 auto;
      padding: 28px 18px 24px;
      border: 3px solid var(--ink);
      outline: 2px solid var(--ink);
      outline-offset: 5px;
      background: var(--paper);
      box-shadow: 8px 8px 0 var(--ink);
      text-align: center;
    }

    .society {
      font-size: .72rem;
      letter-spacing: .28em;
      text-transform: uppercase;
      margin: 0 0 6px;
    }
    .motto {
      font-style: italic;
      font-size: .9rem;
      margin: 0 0 14px;
      color: var(--green);
    }

    /* Tittel: Tintin-aktig trykkforskyvning i rødt */
    h1 {
      margin: 6px 0 0;
      font-size: clamp(2.2rem, 12vw, 5rem);
      line-height: .95;
      letter-spacing: .02em;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 4px 4px 0 var(--red);
    }
    .place {
      display: inline-block;
      margin: 18px 0 6px;
      padding: 6px 22px 8px;
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: var(--gold);
      font-size: clamp(1.05rem, 5.2vw, 1.6rem);
      letter-spacing: .22em;
      text-transform: uppercase;
      font-weight: bold;
    }
    .year {
      margin: 6px 0 0;
      font-size: clamp(3.2rem, 20vw, 6.5rem);
      line-height: 1;
      font-weight: 900;
      color: var(--red);
      -webkit-text-stroke: 3px var(--ink);
      paint-order: stroke fill;
      letter-spacing: .06em;
    }

    .skyline { display: block; width: 100%; height: auto; margin: 10px 0 6px; }

    .divider { display: block; width: 100%; height: 34px; margin: 6px 0; }

    .pillars {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 10px 0 18px;
    }
    .pillar {
      padding: 12px 4px 10px;
      border: 2px solid var(--ink);
      background: var(--paper-dark);
      font-size: clamp(.8rem, 3.6vw, 1.05rem);
      letter-spacing: .12em;
      text-transform: uppercase;
      font-weight: bold;
    }
    .pillar small {
      display: block;
      margin-top: 4px;
      font-weight: normal;
      font-style: italic;
      letter-spacing: 0;
      text-transform: none;
      font-size: .78em;
    }

    .notice {
      margin: 8px 0 0;
      padding: 10px 12px;
      border: 2px dashed var(--ink);
      font-size: .95rem;
      line-height: 1.45;
    }
    .toast {
      margin: 18px 0 0;
      font-size: 1.35rem;
      letter-spacing: .3em;
      text-transform: uppercase;
      font-weight: bold;
      color: var(--red);
    }
    .toast span { color: var(--ink); }
    footer {
      max-width: 620px;
      margin: 22px auto 0;
      text-align: center;
      font-size: .75rem;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="tricolor" aria-hidden="true"><span></span><span></span><span></span></div>

  <main class="poster">
    <p class="society">Koninklijk Fagblikk-Genootschap</p>
    <p class="motto">Eendracht maakt macht</p>

    <h1>Fagblikk</h1>
    <div class="place">Gent · Melle</div>
    <div class="year">2027</div>

    <!-- Gents skyline: Gravensteen, Sint-Niklaaskerk, Belfort, Sint-Baafs og trappegavler -->
    <svg class="skyline" viewBox="0 0 400 250" role="img" aria-label="Gents skyline med de tre tårnene og Gravensteen, speilet i vannet">
      <defs>
        <g id="gent" fill="#1b1410">
          <!-- Gravensteen -->
          <rect x="20" y="120" width="92" height="50"/>
          <path d="M20 120v-8h8v8h8v-8h8v8h8v-8h8v8h8v-8h8v8h8v-8h8v8h8v-8h8v8z"/>
          <rect x="78" y="94" width="28" height="30"/>
          <path d="M78 94v-8h6v8h8v-8h6v8h8v-8h-1z"/>
          <!-- Sint-Niklaaskerk -->
          <rect x="145" y="82" width="22" height="88"/>
          <rect x="141" y="72" width="7" height="16"/>
          <rect x="164" y="72" width="7" height="16"/>
          <path d="M145 82h22l-11-54z"/>
          <!-- Belfort -->
          <rect x="203" y="92" width="28" height="78"/>
          <rect x="206" y="60" width="22" height="34"/>
          <rect x="200" y="56" width="6" height="14"/>
          <rect x="228" y="56" width="6" height="14"/>
          <path d="M205 60h24l-12-44z"/>
          <circle cx="217" cy="12" r="5"/>
          <!-- Sint-Baafs -->
          <rect x="270" y="88" width="40" height="82"/>
          <path d="M270 72v-6h6v6h6v-6h6v6h6v-6h6v6h6v-6h4v22h-40z"/>
          <path d="M273 66h34l-17-18z"/>
          <!-- Trappegavels langs Graslei -->
          <path d="M326 170v-62h6v-6h6v-6h6v6h6v6h6v62z"/>
          <path d="M360 170v-72h6v-8h6v-8h6v8h6v8h6v72z"/>
          <!-- vinduer -->
          <g fill="#f1e4c3">
            <rect x="36" y="134" width="6" height="10"/><rect x="56" y="134" width="6" height="10"/><rect x="94" y="134" width="6" height="10"/>
            <rect x="153" y="100" width="6" height="12"/><rect x="153" y="124" width="6" height="12"/>
            <rect x="213" y="104" width="6" height="12"/><rect x="213" y="128" width="6" height="12"/>
            <rect x="284" y="104" width="7" height="12"/><rect x="284" y="128" width="7" height="12"/>
            <rect x="334" y="124" width="5" height="9"/><rect x="334" y="144" width="5" height="9"/>
            <rect x="368" y="112" width="5" height="9"/><rect x="368" y="132" width="5" height="9"/><rect x="368" y="152" width="5" height="9"/>
          </g>
        </g>
      </defs>

      <!-- solskive -->
      <circle cx="200" cy="108" r="86" fill="#f2b705" stroke="#1b1410" stroke-width="3"/>
      <circle cx="200" cy="108" r="62" fill="none" stroke="#b3261e" stroke-width="3"/>

      <use href="#gent"/>

      <!-- kaikant -->
      <rect x="0" y="170" width="400" height="6" fill="#1b1410"/>

      <!-- speiling i vannet -->
      <g transform="translate(0 346) scale(1 -1)" opacity=".28"><use href="#gent"/></g>
      <rect x="0" y="176" width="400" height="74" fill="#f1e4c3" opacity=".55"/>

      <!-- bølger -->
      <g fill="none" stroke="#1b1410" stroke-width="2.5" stroke-linecap="round">
        <path d="M10 188q10-6 20 0t20 0t20 0t20 0t20 0t20 0"/>
        <path d="M200 198q10-6 20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0"/>
        <path d="M40 212q10-6 20 0t20 0t20 0t20 0t20 0t20 0"/>
        <path d="M230 226q10-6 20 0t20 0t20 0t20 0t20 0t20 0"/>
        <path d="M10 238q10-6 20 0t20 0t20 0t20 0"/>
      </g>
    </svg>

    <!-- Art Nouveau-pisklinje -->
    <svg class="divider" viewBox="0 0 400 34" preserveAspectRatio="none" aria-hidden="true">
      <g fill="none" stroke="#1b1410" stroke-width="3" stroke-linecap="round">
        <path d="M0 17C30 -6 50 40 80 17S130 -6 160 17"/>
        <path d="M400 17C370 -6 350 40 320 17S270 -6 240 17"/>
        <path d="M160 17C175 28 190 28 200 17C210 6 225 6 240 17"/>
      </g>
      <circle cx="200" cy="17" r="5" fill="#b3261e" stroke="#1b1410" stroke-width="2"/>
    </svg>

    <div class="pillars">
      <div class="pillar">Bier<small>trappist &amp; tripel</small></div>
      <div class="pillar">Friet<small>met mayonaise</small></div>
      <div class="pillar">Discipline<small>niet onderhandelbaar</small></div>
    </div>

    <p class="notice">Datoer og program følger. Oppmøte er obligatorisk.</p>

    <p class="toast"><span>★</span> Proost! <span>★</span></p>
  </main>

  <footer>Fagblikk · Gent · Melle · 2027</footer>

  <div class="tricolor" style="margin-top:14px" aria-hidden="true"><span></span><span></span><span></span></div>
</body>
</html>
